name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Отменять на лету можно только черновые прогоны. Сборку релиза с main прерывать
  # нельзя: она уже могла создать тег, и следующий запуск на него наткнётся.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

# Цепочка: тесты → версия → три сборки параллельно → релиз.
# Сборки не создают релиз сами, а передают готовые файлы артефактами прогона:
# иначе задания гонялись бы за один и тот же тег.
jobs:
  tests:
    name: Тесты
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Прогон идёт по csproj, а НЕ по ChudikChat.slnx. Решение включает
      # ChudikChat.App, и сборка решения потребовала бы воркло́ды android
      # и maccatalyst — несколько минут установки ради нуля покрытия.
      # Тестовый проект ссылается только на ChudikChat.Core, а тот — чистый BCL.
      #
      # Category!=Multicast отсеивает три теста, которым нужна многоадресная
      # рассылка и входящий UDP 45678. На виртуалках сборочных служб этого может
      # не быть вовсе. Они гоняются локально — см. DiscoveryTests.
      - name: Прогон тестов
        run: >
          dotnet test tests/ChudikChat.Core.Tests/ChudikChat.Core.Tests.csproj
          -c Release
          --filter "Category!=Multicast"
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      # v7, а не v5: у upload-artifact пятый мажор всё ещё на Node 20,
      # и привычное «поднять на один» предупреждение бы не убрало.
      - name: Выгрузить результаты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  version:
    name: Версия
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Версия = ApplicationDisplayVersion из csproj + номер запуска. Отдельным
      # заданием, потому что её спрашивают трое: обе сборки и создание релиза.
      #
      # ВНИМАНИЕ: github.run_number привязан к этому файлу. Если ci.yml удалить
      # и создать заново, нумерация начнётся с единицы: версия пойдёт назад,
      # тег окажется занят, а обновление поверх установленного MSI перестанет
      # работать — Windows Installer сравнивает версии. Лечится разово:
      # поднять ApplicationDisplayVersion в csproj на ступень вверх, и версия
      # снова окажется впереди всего, что уже выложено.
      - name: Вычислить
        id: compute
        run: |
          $csproj = [xml](Get-Content src/ChudikChat.App/ChudikChat.App.csproj)
          $base = $csproj.SelectSingleNode('//ApplicationDisplayVersion').InnerText.Trim()
          if (-not $base) { throw 'в csproj не нашёлся ApplicationDisplayVersion' }
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          Write-Host "версия: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  windows:
    name: Установщик Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Восстановление проходит по всем целевым платформам проекта, даже когда
      # собирается одна, поэтому на Windows нужны и android, и maccatalyst.
      # Команда разбирается сама — перечислять их руками не надо.
      - name: Воркло́ды MAUI
        run: dotnet workload restore src/ChudikChat.App/ChudikChat.App.csproj

      - name: WiX
        run: |
          dotnet tool install --global wix
          wix eula accept wix7
          wix extension add -g WixToolset.Firewall.wixext
          wix extension add -g WixToolset.Util.wixext

      - name: Сборка установщика
        run: ./build/publish-windows.ps1 -Version ${{ needs.version.outputs.version }}

      # compression-level: 0 — MSI внутри уже сжат, второй проход зипом даёт
      # проценты и стоит минуты на восьмидесяти мегабайтах.
      # retention-days: 1 — это промежуточная передача между заданиями,
      # постоянное место файла на странице релизов.
      - name: Выгрузить MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi
          path: artifacts/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    name: APK Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # На Linux у проекта остаётся единственная цель net10.0-android — так
      # устроены условия в ChudikChat.App.csproj. Поэтому здесь ставится только
      # воркло́д android, без maccatalyst, за который платят задания
      # на Windows и macOS.
      #
      # Android SDK и JDK берутся готовыми из образа runner'а: там есть платформы
      # до android-36 и build-tools 36.0.0, то есть всё, что просит воркло́д.
      - name: Воркло́д android
        run: dotnet workload restore src/ChudikChat.App/ChudikChat.App.csproj

      # JAVA_HOME_21_X64 — переменная окружения самого runner'а, а не контекста
      # env у workflow, поэтому читается через $env: в теле шага, а не ${{ }}.
      # Явно нужен: по умолчанию на ubuntu стоит JDK 17, а это ровно нижняя
      # граница поддержки воркло́да.
      #
      # versionCode — тот же номер запуска, что и последняя часть версии:
      # так номер в настройках телефона совпадает с именем файла.
      - name: Сборка APK
        run: >
          ./build/publish-android.ps1
          -Version ${{ needs.version.outputs.version }}
          -VersionCode ${{ github.run_number }}
          -JavaHome $env:JAVA_HOME_21_X64

      - name: Выгрузить APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: artifacts/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    name: Образ macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # На macOS у проекта две цели: условие в csproj отсекает только windows,
      # поэтому остаются android и maccatalyst и ставятся оба воркло́да.
      # Лишнего android здесь не избежать — восстановление идёт по всем целям.
      - name: Воркло́ды MAUI
        run: dotnet workload restore src/ChudikChat.App/ChudikChat.App.csproj

      # Версия Xcode — жёсткое требование, а не пожелание: при расхождении
      # major.minor с _RecommendedXcodeVersion воркло́да сборка падает с E0191,
      # и это именно ошибка. Сейчас воркло́д просит 26.6, и ровно столько стоит
      # на runner'е по умолчанию — но умолчание образа за год уже менялось
      # трижды, поэтому закрепляем явно. Обновится воркло́д — поменять и здесь.
      #
      # DEVELOPER_DIR, а не xcode-select: тот требует sudo и меняет состояние
      # машины, а переменная действует ровно на этот шаг. Если названной версии
      # в образе не окажется, откатываемся на умолчание: тогда либо повезёт,
      # либо E0191 назовёт обе версии и чинить будет по чему.
      - name: Сборка образа
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          if (-not (Test-Path $env:DEVELOPER_DIR)) {
            Write-Host "::warning::нет $env:DEVELOPER_DIR, берём Xcode по умолчанию"
            Remove-Item Env:DEVELOPER_DIR
          }

          & ./build/publish-maccatalyst.ps1 `
            -Version '${{ needs.version.outputs.version }}' `
            -VersionCode ${{ github.run_number }}

      - name: Выгрузить образ
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: artifacts/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Релиз
    needs: [version, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # v8, хотя у upload-artifact последний мажор седьмой: это разные действия
      # со своей нумерацией. Общее у них требование к Node 24.
      # merge-multiple складывает все артефакты в одну папку, без подпапок
      # по имени артефакта.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $msi = "artifacts/Chudik-$v-x64.msi"
          $apk = "artifacts/Chudik-$v-arm64.apk"
          $dmg = "artifacts/Chudik-$v-arm64.dmg"

          foreach ($file in @($msi, $apk, $dmg)) {
            if (-not (Test-Path $file)) { throw "нет файла $file" }
          }

          $notes = @"
          Чудик $v — сборки для Windows, Android и macOS. Устройства должны
          быть в одной домашней сети.

          ## Windows, x64

          Скачать ``Chudik-$v-x64.msi`` и запустить. Нужны права администратора:
          установщик заводит правила брандмауэра, без которых Windows молча режет
          входящие соединения и пиры не находятся. Когда установка закончится,
          Чудик запустится сам.

          Пакет не подписан, поэтому Windows покажет «Windows защитила ваш
          компьютер»: «Подробнее» → «Выполнить в любом случае».

          Внутри всё нужное, включая рантайм .NET и Windows App SDK — ставить
          ничего заранее не требуется. Удаление не трогает принятые файлы
          в ``Downloads\ChudikChat``.

          ## Android, arm64

          Скачать ``Chudik-$v-arm64.apk`` и открыть на телефоне; Android спросит
          разрешение на установку из этого источника. Нужен Android 8 или новее
          и 64-битное устройство — на 32-битном пакет не установится.

          **Обновление поверх предыдущей версии не встанет.** APK подписан
          отладочным ключом, и у каждой сборки он свой, поэтому Android считает
          новый пакет чужим приложением. Придётся удалить старую версию, а вместе
          с ней пропадут принятые файлы: на Android они лежат в папке приложения.

          ## macOS, Apple Silicon

          Скачать ``Chudik-$v-arm64.dmg``, открыть и перетащить «Чудик»
          в «Программы». Нужен Mac на Apple Silicon и macOS 12 или новее:
          сборки под Intel нет.

          Приложение подписано ad-hoc и не нотаризовано, поэтому при первом
          запуске macOS скажет, что не может проверить разработчика. Разрешить
          нужно один раз: Системные настройки → «Конфиденциальность
          и безопасность» → «Всё равно открыть». Control-клик по значку,
          которым это обходили раньше, в macOS 15 уже не помогает.

          На macOS 15 и новее система отдельно спросит доступ к локальной
          сети — без него Чудик никого не найдёт.

          Собрано из $env:GITHUB_SHA
          "@

          gh release create "v$v" $msi $apk $dmg --title "Чудик $v" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "не удалось создать релиз (код $LASTEXITCODE)" }

      # Каждый коммит в main — релиз на сотню мегабайт. Без чистки страница
      # релизов за пару месяцев становится нечитаемой.
      - name: Убрать старые релизы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $keep = 10
          $all = gh release list --limit 200 --json tagName,createdAt | ConvertFrom-Json
          if (-not $all) { return }

          $old = @($all | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -Skip $keep)
          Write-Host "релизов всего: $($all.Count), к удалению: $($old.Count)"

          foreach ($r in $old) {
            Write-Host "  удаляю $($r.tagName)"
            gh release delete $r.tagName --yes --cleanup-tag
          }
