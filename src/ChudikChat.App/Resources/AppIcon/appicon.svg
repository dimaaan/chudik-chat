<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Фон иконки. Сплошной и без своих скруглений: macOS, Android и Windows режут
    углы сами, каждый по-своему. Цвет задан здесь, а не только в csproj: Color
    у MauiIcon фон не перекрашивает, прямоугольник из SVG лежит поверх него.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="456" height="456" fill="#2F6FEB" />
</svg>
